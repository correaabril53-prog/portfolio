<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2d78"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="16" fill="#040612"/>
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="url(#favGrad)" stroke-width="1.8" opacity="0.6"/>
  
  <!-- Code brackets </> in glowing neon gradient -->
  <path d="M22 22 L11 32 L22 42" fill="none" stroke="url(#favGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#favGlow)"/>
  <path d="M42 22 L53 32 L42 42" fill="none" stroke="url(#favGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#favGlow)"/>
  <line x1="36" y1="18" x2="28" y2="46" stroke="#ff2d78" stroke-width="4" stroke-linecap="round" filter="url(#favGlow)"/>
</svg>
